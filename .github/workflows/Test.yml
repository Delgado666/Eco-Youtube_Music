name: test

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Compile extension module
        run: |
          chmod +x ./gradlew
          ./gradlew :ext:compileKotlin
